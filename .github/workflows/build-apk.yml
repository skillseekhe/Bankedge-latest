name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Project and Compile APK
        run: |
          # 1. Create clean app scaffold
          flutter create -t app --org com.grexa.growth grexa_app
          
          # 2. Add dependencies cleanly
          cd grexa_app
          flutter pub add http shared_preferences url_launcher
          
          # 3. Inject INTERNET and ACCESS_NETWORK_STATE permissions into AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          
          # 4. Patch build.gradle to ensure release builds use debug signing and disable lintVital failures
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' android/app/build.gradle.kts 2>/dev/null || true
            sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/g' android/app/build.gradle.kts 2>/dev/null || true
          fi
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle 2>/dev/null || true
            echo "android { lintOptions { checkReleaseBuilds false; abortOnError false } }" >> android/app/build.gradle
          fi

          # 5. Copy custom Dart application code
          cp ../lib/main.dart lib/main.dart
          
          # 6. Fetch packages
          flutter pub get
          
          # 7. Compile APK (release with debug signing, fallback to debug if signing checks trip)
          flutter build apk --release --no-tree-shake-icons || flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grexa-universal-ai-app-release
          path: grexa_app/build/app/outputs/flutter-apk/*.apk
